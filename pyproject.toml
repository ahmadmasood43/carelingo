[project]
name = "carelingo"
version = "0.1.0"
description = "Fact-preservation checks for translated nursing documentation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[project.scripts]
carelingo = "carelingo.cli:main"

[dependency-groups]
# Speech recognition on an NVIDIA GPU. The CUDA libraries come from pip, so no system
# CUDA toolkit is needed.
asr = [
    "faster-whisper>=1.2",
    "jiwer>=3.0",
    "nvidia-cublas-cu12>=12.4",
    "nvidia-cudnn-cu12>=9,<10",
]
dev = [
    "jiwer>=4.0.0",
    "numpy>=2.5.4",
    "pytest>=8.3",
    "ruff>=0.8",
]
tts = [
    "piper-tts>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
