# Error labels for the final system's drafts made from speech-recognition
# transcripts of synthetic speech (results/pipeline-tts-extract-large.jsonl; Piper
# voices, Whisper large-v3-turbo, language pinned; extractor mistral-large-4 because
# ministral-14b was unavailable). Labelled against what was dictated, not what was heard.
# Written by one LLM annotator (Claude); not reviewed by a clinician or native speaker.
# c013-c018 were labelled after seeing the verifier's
# flags; c019 onwards from dictation, transcript and note only.
# Classes as in e001-dev.yaml plus fact_omitted, and:
#   drug_changed     a different or unrecognisable drug (clinical)
#   drug_misspelled  the right drug, misspelt (counted separately)
#   value_changed    a number, unit or measured quantity changed (clinical)
#   room_changed     room number changed or missing (clinical)
# cause: asr when the transcript already carried the error, draft otherwise.
# Resident-name misspellings are counted automatically, not labelled here.
# The typed-text control run (results/pipeline-typed-extract-large.jsonl) was read
# the same way and all 48 notes were clean.
- {case: c013, language: en, errors: [{type: drug_changed, cause: asr}]}
- {case: c013, language: pl, errors: [{type: drug_misspelled, cause: asr}, {type: language_leak, cause: asr}]}
- {case: c014, language: en, errors: [{type: value_changed, cause: asr}]}
- {case: c014, language: pl, errors: []}
- {case: c015, language: en, errors: [{type: fact_omitted, cause: asr}]}
- {case: c015, language: pl, errors: []}
