# Synthetic evaluation cases (development split). All residents are fictional.
# Sources imitate spoken dictation: informal, sometimes with German nursing terms
# mixed in, self-corrections, and units left implicit.

- id: c001
  split: dev
  phenomena: [blood_pressure, decimal, negation, laterality, as_needed, refusal, code_switch]
  german_reference: >-
    Fr. Brandt, Zi. 12: RR 145/90 mmHg, Puls 88/min, Temperatur 36,9 °C, kein Fieber.
    Klagt über Schmerzen im rechten Knie (NRS 6/10), Bedarfsmedikation Metamizol 500 mg
    verabreicht. Duschen heute abgelehnt.
  facts:
    - {kind: resident, name: Brandt, room: "12"}
    - {kind: measurement, quantity: blood_pressure, values: [145, 90], unit: mmHg}
    - {kind: measurement, quantity: pulse, values: [88], unit: /min}
    - {kind: measurement, quantity: temperature, values: [36.9], unit: °C}
    - {kind: finding, concept: Fieber, polarity: absent}
    - {kind: finding, concept: Schmerzen, site: Knie, laterality: right}
    - {kind: score, scale: NRS, value: 6, maximum: 10}
    - {kind: medication, drug: Metamizol, dose: 500, unit: mg, as_needed: true}
    - {kind: measure, action: Duschen, status: refused}
  sources:
    en: >-
      Mrs Brandt, room 12. Blood pressure 145 over 90, pulse 88. Temperature 36.9, so no
      fever. She's complaining about pain in her right knee, about 6 out of 10, so I gave the
      Bedarfsmedikation, Metamizol 500 milligrams. She refused the shower today.
    pl: >-
      Pani Brandt, pokój 12. Ciśnienie 145 na 90, tętno 88. Temperatura 36,9, czyli bez
      gorączki. Skarży się na ból prawego kolana, mniej więcej 6 na 10, więc podałam
      Bedarfsmedikation, Metamizol 500 miligramów. Dzisiaj odmówiła prysznica.

- id: c002
  split: dev
  phenomena: [fall, negation, laterality, blood_pressure, time]
  german_reference: >-
    Hr. Wagner, Zi. 7: Gegen 03:00 Uhr Sturz im Badezimmer, auf dem Boden liegend
    aufgefunden. Keine Kopfverletzung. Hämatom an der linken Hüfte, Schmerzen NRS 4/10.
    RR 160/95 mmHg, Puls 96/min. Hausarzt informiert.
  facts:
    - {kind: resident, name: Wagner, room: "7"}
    - {kind: finding, concept: Sturz, context: "03:00"}
    - {kind: finding, concept: Kopfverletzung, polarity: absent}
    - {kind: finding, concept: Hämatom, site: Hüfte, laterality: left}
    - {kind: finding, concept: Schmerzen}
    - {kind: score, scale: NRS, value: 4, maximum: 10}
    - {kind: measurement, quantity: blood_pressure, values: [160, 95], unit: mmHg}
    - {kind: measurement, quantity: pulse, values: [96], unit: /min}
    - {kind: measure, action: Hausarzt informiert}
  sources:
    en: >-
      Mr Wagner, room 7. He had a fall tonight around 3 o'clock in the bathroom, I found him
      lying on the floor. No head injury. He has a bruise on his left hip, pain about 4 out of
      10. Blood pressure 160 over 95, pulse 96. I informed the GP.
    pl: >-
      Pan Wagner, pokój 7. W nocy około godziny 3 upadł w łazience, znalazłam go leżącego na
      podłodze. Bez urazu głowy. Ma siniaka na lewym biodrze, ból około 4 na 10. Ciśnienie 160
      na 95, tętno 96. Poinformowałam lekarza rodzinnego.

